<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Funcionários | ServiceFlow
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/funcionarios.css"
    >

    <link
        rel="stylesheet"
        href="../css/flux.css"
    >

</head>

<body>

<div class="app-container">

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-header">

            <a
                href="dashboard.html"
                class="logo"
            >
                <span class="logo-icon"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><defs><linearGradient id="sf-logo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#sf-logo-g)"/><path d="M8 11h9a3 3 0 0 1 0 6H12a3 3 0 0 0 0 6h12" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M21.5 20.5 24 23l-2.5 2.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

                <span class="logo-text">
                    ServiceFlow
                </span>

            </a>

        </div>

        <nav class="sidebar-menu">

            <a
                href="dashboard.html"
                class="menu-item"
            >
                <span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>
                <span>Dashboard</span>
            </a>

            <a
                href="clientes.html"
                class="menu-item"
            >
                <span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5a3 3 0 0 1 0 6M18.5 14.8c1.5.8 2.5 2.4 2.5 5.2"/></svg></span>
                <span>Clientes</span>
            </a>

            <a
                href="funcionarios.html"
                class="menu-item active"
            >
                <span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg></span>
                <span>Funcionários</span>
            </a>

            <a
                href="chamados.html"
                class="menu-item"
            >
                <span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a2 2 0 0 0 0 6v3h18v-3a2 2 0 0 1 0-6V6H3z"/><path d="M14 6v12" stroke-dasharray="2 2.5"/></svg></span>
                <span>Chamados</span>
            </a>

            <a
                href="ordens-servico.html"
                class="menu-item"
            >
                <span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L3 17.7 6.3 21l6.3-6.3a4 4 0 0 0 5.1-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg></span>
                <span>Ordens de serviço</span>
            </a>

            <a
                href="perfil.html"
                class="menu-item"
            >
                <span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg></span>
                <span>Minha conta</span>
            </a>

        </nav>

        <div class="sidebar-footer">

            <button
                type="button"
                class="logout-button"
                id="botaoSair"
            >
                <span class="sf-ico"></span>
                <span>Sair</span>
            </button>

        </div>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <div class="topbar-left">

                <div>

                    <h1>
                        Funcionários
                    </h1>

                    <p>
                        Gerencie toda a equipe da empresa
                    </p>

                </div>

            </div>

            <a
                href="perfil.html"
                class="user-area user-profile-link"
            >

                <div class="user-information">

                    <strong id="user-name">
                        Usuário
                    </strong>

                    <span id="user-role">
                        Carregando...
                    </span>

                </div>

                <div
                    class="user-avatar"
                    id="user-avatar"
                >
                    U
                </div>

            </a>

        </header>

        <section class="page-content">

            <div class="page-header">

                <div>

                    <h2>
                        Funcionários
                    </h2>

                    <p>
                        Gerencie os funcionários da empresa.
                    </p>

                </div>

                <button
                    type="button"
                    class="primary-button"
                    id="botaoPendentes"
                >
                    Solicitações Pendentes
                </button>

            </div>

            <div class="content-card">

                <div class="filters">

                    <div class="search-box">

                        <label for="pesquisaFuncionario">
                            Pesquisar
                        </label>

                        <input
                            type="search"
                            id="pesquisaFuncionario"
                            placeholder="Pesquisar nome, e-mail, cargo..."
                        >

                    </div>

                    <div class="filter-box">

                        <label for="filtroStatus">
                            Status
                        </label>

                        <select id="filtroStatus">

                            <option value="">
                                Todos
                            </option>

                            <option value="ATIVO">
                                Ativos
                            </option>

                            <option value="INATIVO">
                                Inativos
                            </option>

                            <option value="PENDENTE">
                                Pendentes
                            </option>

                        </select>

                    </div>

                    <button
                        type="button"
                        class="secondary-button"
                        id="botaoLimparFiltros"
                    >
                        Limpar filtros
                    </button>

                </div>

                <div class="table-header">

                    <strong id="quantidadeFuncionarios">
                        0 funcionário(s)
                    </strong>

                </div>
                                <div class="table-container">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    Nome
                                </th>

                                <th>
                                    E-mail
                                </th>

                                <th>
                                    Cargo
                                </th>

                                <th>
                                    Status
                                </th>

                                <th class="actions-column">
                                    Ações
                                </th>

                            </tr>

                        </thead>

                        <tbody id="tabelaFuncionarios">

                            <tr>

                                <td
                                    colspan="5"
                                    class="loading-row"
                                >
                                    Carregando funcionários...
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

                <div class="pagination">

                    <button
                        type="button"
                        class="pagination-button"
                        id="paginaAnterior"
                    >
                        ← Anterior
                    </button>

                    <span id="informacaoPagina">
                        Página 1 de 1
                    </span>

                    <button
                        type="button"
                        class="pagination-button"
                        id="proximaPagina"
                    >
                        Próxima →
                    </button>

                </div>

            </div>

        </section>

    </main>

</div>

<script src="../js/config.js"></script>
    <script src="../js/shell.js"></script>
    <script src="../js/effects.js"></script>

<script src="../js/funcionarios.js"></script>

</body>

</html>
