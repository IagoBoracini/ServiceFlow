# ==========================
# BANCO DE DADOS
# ==========================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ==========================
# JPA / HIBERNATE
# ==========================

# Em produção prefira JPA_DDL_AUTO=validate (com migrations); "update"
# é mantido como padrão para não alterar o comportamento atual.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# SEGURANÇA
# ==========================

# OBRIGATÓRIA: mínimo de 32 caracteres. Nunca coloque o valor real aqui.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Origens do frontend autorizadas a chamar a API (separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500,https://service-flow-n9wv.vercel.app,http://localhost:63342}

# Valida os dígitos verificadores do CNPJ no cadastro da empresa
app.cnpj.validar-digitos=${VALIDAR_DIGITOS_CNPJ:true}

# Modo demonstração (conta somente leitura com dados fictícios)
app.demo.enabled=${APP_DEMO_ENABLED:false}
app.demo.email=${APP_DEMO_EMAIL:demo@serviceflow.app}

# ==========================
# SERVIDOR
# ==========================

server.port=${PORT:8080}

# ==========================
# SWAGGER
# ==========================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true