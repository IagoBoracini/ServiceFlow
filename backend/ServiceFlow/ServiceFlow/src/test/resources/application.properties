# Configuração usada apenas nos testes (banco em memória, sem MySQL).
spring.datasource.url=jdbc:h2:mem:serviceflow_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.jwt.secret=segredo-somente-para-testes-0123456789-abcdef
app.jwt.expiration-minutes=5
app.cors.allowed-origins=http://localhost:5500
app.cnpj.validar-digitos=true
